name: Monthly Price Check Reminder

on:
  schedule:
    # 毎月1日 JST 10:00 (UTC 01:00)
    - cron: '0 1 1 * *'
  workflow_dispatch:

jobs:
  create-reminder-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract product list
        id: products
        run: |
          # budget.ts から商品名とminAmountを抽出
          PRODUCTS=$(grep -oP "minAmount: \K\d+, name: '\K[^']+" lib/data/budget.ts | sort -u | head -60)
          echo "products<<EOF" >> $GITHUB_OUTPUT
          echo "$PRODUCTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10)
            const body = `## 月次価格確認 ${today}

            budget.ts の商品価格を確認し、minAmount のしきい値がズレていたら修正してください。

            ### 優先確認リスト（価格変動が大きい商品）

            | カテゴリ | 商品 | 確認先 |
            |---------|------|-------|
            | チェア | ハーマンミラー アーロン | [kakaku](https://search.kakaku.com/%E3%83%8F%E3%83%BC%E3%83%9E%E3%83%B3%E3%83%9F%E3%83%A9%E3%83%BC%20%E3%82%A2%E3%83%BC%E3%83%AD%E3%83%B3%E3%83%81%E3%82%A7%E3%82%A2/) |
            | チェア | Secretlab TITAN Evo | [公式](https://secretlabchairs.jp/) |
            | チェア | オカムラ シルフィー | [kakaku](https://search.kakaku.com/%E3%82%AA%E3%82%AB%E3%83%A0%E3%83%A9%20%E3%82%B7%E3%83%AB%E3%83%95%E3%82%A3%E3%83%BC/) |
            | モニター | EIZO ColorEdge CS2740 | [kakaku](https://kakaku.com/item/K0001203731/) |
            | モニター | DELL U2723QE | [kakaku](https://kakaku.com/item/K0001430540/) |
            | モニター | EIZO FlexScan EV2795 | [kakaku](https://search.kakaku.com/EIZO%20EV2795/) |
            | デスク | FLEXISPOT E7 天板セット | [公式](https://www.flexispot.jp/e7-set.html) |
            | 音響 | Universal Audio Apollo Twin X | [サウンドハウス](https://www.soundhouse.co.jp/en/search/index?i_type=a&search_all=apollo+twin+x) |
            | タブレット | Wacom Cintiq 16 | [kakaku](https://price-rank.com/p/7658?condition=new) |

            ### 修正手順

            1. 上記リンクで現在の最安値を確認
            2. \`lib/data/budget.ts\` の該当 \`minAmount\` を実売価格に合わせて更新
            3. 大きくズレていたら Claude Code に「budget.ts の価格を更新して」と伝える

            ### 前回の修正
            最後に全商品価格を確認した日付は PR/コミット履歴を参照してください。

            /cc @kanazaoki`

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[月次] 予算シミュレーター 価格確認 ${today}`,
              body,
              labels: ['maintenance']
            })
